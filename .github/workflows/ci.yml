name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils

      - name: Check shell scripts and app entry
        run: |
          for f in packaging/build-deb.sh packaging/postinst packaging/phone-mic-cam; do
            sh -n "$f"
          done
          desktop-file-validate packaging/phone-mic-cam.desktop

      - name: Run tests (also builds the .deb)
        run: python -m unittest discover -s tests -v

      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: phone-mic-cam-deb
          path: dist/*.deb
          if-no-files-found: error
